<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="700" viewBox="0 0 1610 700" role="img" aria-labelledby="title desc">
  <title id="title">Fixauto knowledge graph</title>
  <desc id="desc">Product domain relationships for the Fixauto managed vehicle repair service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f87a8"/>
    </marker>
    <style>
      .edge path { fill: none; stroke: #6f87a8; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge text { fill: #c7d4e7; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; paint-order: stroke; stroke: #0a101b; stroke-width: 5px; stroke-linejoin: round; }
      .node rect { stroke-width: 1.6; }
      .node .title { fill: #f3f7ff; font: 650 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .node .sub { fill: #c1ccdf; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .person rect { fill: #123a38; stroke: #68dec3; }
      .record rect { fill: #182f50; stroke: #86baff; }
      .action rect { fill: #30284c; stroke: #bea4ff; }
      .gate rect { fill: #483820; stroke: #ffcd7d; }
      .person .dot { fill: #68dec3; }
      .record .dot { fill: #86baff; }
      .action .dot { fill: #bea4ff; }
      .gate .dot { fill: #ffcd7d; }
    </style>
  </defs>

